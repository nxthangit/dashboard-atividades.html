<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gestão de Atividades</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>
:root{
  --blue:#1a6bdc;--blue-light:#e8f0fd;--amber:#d97706;--amber-light:#fef3c7;
  --green:#16a34a;--green-light:#dcfce7;--gray:#6b7280;--gray-light:#f3f4f6;
  --red:#dc2626;--red-light:#fee2e2;
  --bg:#f8f9fc;--surface:#fff;--border:#e5e7eb;--border-subtle:#f1f2f5;
  --text:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow:0 4px 16px rgba(0,0,0,.07);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.loading-logo{width:48px;height:48px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:14px;color:var(--text-secondary);}
@keyframes spin{to{transform:rotate(360deg);}}

/* LAYOUT */
.layout{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:18px 18px 14px;border-bottom:1px solid var(--border-subtle);}
.logo-mark{display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
.logo-text{font-size:14px;font-weight:600;color:var(--text);}
.logo-sub{font-size:11px;color:var(--text-tertiary);margin-top:1px;}
.sidebar-nav{padding:10px 8px;flex:1;}
.nav-section{display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin:14px 0 4px;}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;}
.nav-add-btn{width:20px;height:20px;border-radius:5px;border:none;background:none;cursor:pointer;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:14px;}
.nav-add-btn:hover{background:var(--gray-light);color:var(--text);}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text-secondary);font-size:13px;transition:all .15s;user-select:none;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--bg);color:var(--text);}
.nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:500;}
.nav-item i{font-size:15px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--gray-light);color:var(--text-secondary);font-size:11px;font-family:var(--mono);padding:1px 7px;border-radius:10px;font-weight:500;}
.nav-item.active .nav-badge{background:rgba(26,107,220,.12);color:var(--blue);}
.folder-row{display:flex;align-items:center;border-radius:8px;overflow:hidden;}
.folder-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;flex:1;cursor:pointer;color:var(--text-secondary);font-size:13px;transition:all .15s;border:none;background:none;text-align:left;min-width:0;}
.folder-btn:hover{background:var(--bg);color:var(--text);}
.folder-btn.active{background:var(--blue-light);color:var(--blue);font-weight:500;}
.folder-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.folder-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.folder-actions{display:none;gap:2px;padding-right:6px;}
.folder-row:hover .folder-actions{display:flex;}
.fol-act-btn{width:22px;height:22px;border-radius:5px;border:none;background:none;cursor:pointer;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:13px;}
.fol-act-btn:hover{background:var(--gray-light);color:var(--text);}
.fol-act-btn.del:hover{background:var(--red-light);color:var(--red);}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border-subtle);}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-tertiary);padding:4px 6px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s ease-in-out infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* TOPBAR */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10;}
.topbar-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
.page-title{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:7px;}
.topbar-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;flex:1;max-width:320px;}
.topbar-search i{color:var(--text-tertiary);font-size:15px;}
.topbar-search input{border:none;background:none;font-family:var(--font);font-size:13px;color:var(--text);outline:none;width:100%;}
.topbar-search input::placeholder{color:var(--text-tertiary);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.btn-primary{display:flex;align-items:center;gap:7px;padding:7px 15px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-primary:hover{background:#155bbf;}
.btn-icon-top{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);font-size:15px;transition:all .15s;}
.btn-icon-top:hover{background:var(--bg);color:var(--text);}

/* CONTENT */
.content{padding:20px 24px;flex:1;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-label{font-size:11.5px;font-weight:500;color:var(--text-secondary);}
.kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.kpi-num{font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.5px;font-family:var(--mono);}
.kpi-sub{font-size:11px;color:var(--text-tertiary);margin-top:2px;}

/* BOARD CONTROLS */
.board-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text-secondary);cursor:pointer;transition:all .15s;user-select:none;}
.pill:hover{border-color:#c5d4f0;color:var(--text);}
.pill.active{background:var(--blue-light);border-color:#b0c8f5;color:var(--blue);font-weight:500;}
.pill i{font-size:13px;}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.vbtn{padding:6px 11px;font-size:13px;background:none;border:none;cursor:pointer;color:var(--text-tertiary);transition:all .15s;}
.vbtn.active{background:var(--blue-light);color:var(--blue);}
.vbtn:hover:not(.active){background:var(--bg);}

/* BOARD */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;}
.col-wrap{min-width:0;}
.col-header{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;border-bottom:none;}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-name{font-size:13px;font-weight:500;flex:1;}
.col-count{font-size:11px;font-family:var(--mono);background:var(--bg);color:var(--text-tertiary);padding:1px 7px;border-radius:8px;font-weight:500;}
.col-body{background:var(--bg);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);min-height:80px;padding:8px;display:flex;flex-direction:column;gap:7px;}

/* CARDS */
.act-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm);}
.act-card:hover{border-color:#c5d4f0;box-shadow:var(--shadow);}
.act-card.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,107,220,.08);}
.folder-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:500;margin-bottom:6px;}
.act-card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;}
.act-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;flex:1;}
.badge-priority{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.2px;flex-shrink:0;}
.pri-alta{background:var(--red-light);color:var(--red);}
.pri-media{background:var(--amber-light);color:var(--amber);}
.pri-baixa{background:var(--green-light);color:var(--green);}
.act-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px;}
.meta-item{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-secondary);}
.meta-item i{font-size:12px;}
.overdue-tag{display:inline-block;margin-left:6px;font-size:10px;background:var(--red-light);color:var(--red);padding:1px 5px;border-radius:5px;vertical-align:middle;font-weight:600;}
.progress-bar{height:3px;background:var(--border-subtle);border-radius:3px;overflow:hidden;margin-top:3px;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}

/* STEPS MINI (no card) */
.steps-mini{display:flex;gap:3px;margin-top:6px;align-items:center;}
.step-mini-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);flex-shrink:0;transition:all .15s;}
.step-mini-dot.done{background:var(--green);border-color:var(--green);}
.steps-mini-label{font-size:11px;color:var(--text-tertiary);margin-left:4px;}

/* LIST VIEW */
.list-view{display:none;}
table.activity-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
table.activity-table th{padding:9px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-bottom:1px solid var(--border);text-align:left;}
table.activity-table td{padding:11px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border-subtle);vertical-align:middle;}
table.activity-table tr:last-child td{border-bottom:none;}
table.activity-table tr:hover td{background:var(--bg);cursor:pointer;}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;}
.s-em_andamento{background:var(--blue-light);color:var(--blue);}
.s-pendente{background:var(--amber-light);color:var(--amber);}
.s-concluido{background:var(--green-light);color:var(--green);}
.s-arquivado{background:var(--gray-light);color:var(--gray);}
.empty-col{text-align:center;padding:24px 12px;color:var(--text-tertiary);font-size:12px;}
.empty-col i{font-size:22px;display:block;margin-bottom:5px;opacity:.4;}

/* DETAIL PANEL */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:40;display:none;backdrop-filter:blur(2px);}
.detail-overlay.open{display:block;}
.detail-panel{position:fixed;top:0;right:0;width:400px;height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
.detail-panel.open{transform:translateX(0);}
.detail-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.detail-head-info{flex:1;min-width:0;}
.detail-head-info h3{font-size:15px;font-weight:600;margin-bottom:5px;color:var(--text);}
.detail-actions{display:flex;gap:5px;}
.btn-sm{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);font-size:14px;transition:all .15s;}
.btn-sm:hover{background:var(--bg);color:var(--text);}
.btn-sm.danger:hover{background:var(--red-light);color:var(--red);border-color:#fca5a5;}
.detail-body{flex:1;overflow-y:auto;padding:18px;}
.detail-section{margin-bottom:20px;}
.detail-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-tertiary);margin-bottom:10px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.detail-field label{font-size:11px;color:var(--text-tertiary);display:block;margin-bottom:3px;}
.detail-field span{font-size:13px;font-weight:500;color:var(--text);}
.detail-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;}
.progress-large{height:6px;background:var(--border-subtle);border-radius:6px;overflow:hidden;margin-top:8px;}
.progress-large .fill{height:100%;border-radius:6px;transition:width .4s;}
.move-section{margin-top:16px;}
.move-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-tertiary);margin-bottom:8px;}
.move-btns{display:flex;flex-wrap:wrap;gap:6px;}
.move-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-family:var(--font);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.move-btn:hover{background:var(--surface);border-color:#c5d4f0;color:var(--blue);}

/* ── STEPS (etapas) ── */
.steps-section{margin-top:4px;}
.steps-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.steps-progress-info{font-size:12px;color:var(--text-secondary);}
.steps-progress-info strong{color:var(--text);font-family:var(--mono);}
.btn-add-step{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;border:1px solid var(--border);background:none;font-family:var(--font);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.btn-add-step:hover{background:var(--blue-light);color:var(--blue);border-color:#b0c8f5;}
.steps-list{display:flex;flex-direction:column;gap:6px;}
.step-item{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg);border:1px solid var(--border-subtle);border-radius:8px;transition:all .15s;}
.step-item:hover{border-color:var(--border);background:var(--surface);}
.step-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.step-check.done{background:var(--green);border-color:var(--green);}
.step-check.done::after{content:'';width:5px;height:9px;border:2px solid #fff;border-left:none;border-top:none;transform:rotate(45deg) translateY(-1px);display:block;}
.step-label{flex:1;font-size:13px;color:var(--text);transition:all .15s;}
.step-label.done{text-decoration:line-through;color:var(--text-tertiary);}
.step-weight{font-size:11px;font-family:var(--mono);color:var(--text-tertiary);background:var(--gray-light);padding:2px 6px;border-radius:5px;flex-shrink:0;}
.step-del{width:22px;height:22px;border-radius:5px;border:none;background:none;cursor:pointer;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:all .15s;}
.step-item:hover .step-del{opacity:1;}
.step-del:hover{background:var(--red-light);color:var(--red);}
.add-step-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
.add-step-input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--surface);outline:none;}
.add-step-input:focus{border-color:var(--blue);}
.add-step-weight{width:70px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface);outline:none;text-align:center;}
.add-step-weight:focus{border-color:var(--blue);}
.btn-step-save{padding:7px 12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:12px;cursor:pointer;}
.btn-step-cancel{padding:7px 10px;background:none;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:12px;color:var(--text-secondary);cursor:pointer;}
.steps-empty{font-size:12px;color:var(--text-tertiary);text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px dashed var(--border);}
.auto-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:#ede9fe;color:#7c3aed;padding:2px 7px;border-radius:8px;font-weight:500;margin-top:4px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-lg);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:22px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h2{font-size:15px;font-weight:600;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{margin-bottom:13px;}
.form-group label{font-size:11.5px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:5px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);}
.form-group textarea{resize:vertical;min-height:72px;}
.form-info{font-size:11px;color:var(--text-tertiary);margin-top:4px;display:flex;align-items:center;gap:4px;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.btn-cancel{padding:7px 16px;border:1px solid var(--border);border-radius:8px;background:none;font-family:var(--font);font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.btn-cancel:hover{background:var(--bg);}
.btn-save{padding:7px 18px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.btn-save:hover{background:#155bbf;}
.color-picker{display:flex;gap:8px;flex-wrap:wrap;}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .15s;border:2px solid transparent;}
.color-opt:hover{transform:scale(1.15);}
.color-opt.selected{border-color:var(--text);transform:scale(1.1);}

/* CONFIRM */
.confirm-box{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150;display:none;align-items:center;justify-content:center;}
.confirm-box.open{display:flex;}
.confirm-inner{background:var(--surface);border-radius:var(--radius-lg);padding:22px;max-width:320px;width:90%;box-shadow:var(--shadow-lg);text-align:center;}
.confirm-inner h3{font-size:15px;font-weight:600;margin-bottom:7px;}
.confirm-inner p{font-size:13px;color:var(--text-secondary);margin-bottom:18px;}
.confirm-btns{display:flex;gap:10px;justify-content:center;}
.btn-danger{padding:7px 18px;background:var(--red);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:all .25s;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:900px){.sidebar{display:none;}.kpi-grid{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}.detail-panel{width:100%;}}
@media(max-width:600px){.content{padding:14px;}.topbar{padding:0 14px;}.board{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="loading-screen">
  <div class="loading-logo"><i class="ti ti-layout-kanban"></i></div>
  <div class="loading-spinner"></div>
  <div class="loading-text">Conectando ao banco de dados...</div>
</div>

<div class="layout" id="app" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <div class="logo-icon"><i class="ti ti-layout-kanban"></i></div>
        <div><div class="logo-text">Atividades</div><div class="logo-sub">Gestão de Demandas</div></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Visão geral</span></div>
      <button class="nav-item active" onclick="navClick('board',this)"><i class="ti ti-layout-kanban"></i>Painel<span class="nav-badge" id="nb-total">0</span></button>
      <button class="nav-item" onclick="navClick('em_andamento',this)"><i class="ti ti-loader"></i>Em andamento<span class="nav-badge" id="nb-em_andamento">0</span></button>
      <button class="nav-item" onclick="navClick('pendente',this)"><i class="ti ti-clock"></i>Pendentes<span class="nav-badge" id="nb-pendente">0</span></button>
      <button class="nav-item" onclick="navClick('concluido',this)"><i class="ti ti-circle-check"></i>Concluídos<span class="nav-badge" id="nb-concluido">0</span></button>
      <div class="nav-section"><span class="nav-section-label">Arquivo</span></div>
      <button class="nav-item" onclick="navClick('arquivado',this)"><i class="ti ti-archive"></i>Arquivados<span class="nav-badge" id="nb-arquivado">0</span></button>
      <div class="nav-section"><span class="nav-section-label">Pastas</span><button class="nav-add-btn" onclick="openFolderModal()" title="Nova pasta"><i class="ti ti-plus"></i></button></div>
      <div id="folder-nav"></div>
    </nav>
    <div class="sidebar-footer">
      <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-text">Sincronizado</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="page-title" id="page-title">Painel de Atividades</span>
        <div class="topbar-search"><i class="ti ti-search"></i><input type="text" placeholder="Buscar atividade, responsável, área..." id="search-input" oninput="render()"/></div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon-top" title="Exportar CSV" onclick="exportCSV()"><i class="ti ti-download"></i></button>
        <button class="btn-primary" onclick="openModal()"><i class="ti ti-plus"></i>Nova atividade</button>
      </div>
    </div>
    <div class="content">
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="board-controls">
        <div class="filter-pills">
          <button class="pill active" onclick="setFilter('todas',this)"><i class="ti ti-layout-grid"></i>Todas</button>
          <button class="pill" onclick="setFilter('Em andamento',this)"><i class="ti ti-loader"></i>Em andamento</button>
          <button class="pill" onclick="setFilter('Pendente',this)"><i class="ti ti-clock"></i>Pendente</button>
          <button class="pill" onclick="setFilter('Concluído',this)"><i class="ti ti-circle-check"></i>Concluído</button>
          <button class="pill" onclick="setFilter('Arquivado',this)"><i class="ti ti-archive"></i>Arquivado</button>
        </div>
        <div class="view-toggle">
          <button class="vbtn active" id="vbtn-board" onclick="setView('board')"><i class="ti ti-layout-kanban"></i></button>
          <button class="vbtn" id="vbtn-list" onclick="setView('list')"><i class="ti ti-list"></i></button>
        </div>
      </div>
      <div id="board" class="board"></div>
      <div id="list-view" class="list-view"></div>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="detail-head">
    <div class="detail-head-info">
      <h3 id="dp-title"></h3>
      <div id="dp-badge"></div>
    </div>
    <div class="detail-actions">
      <button class="btn-sm" id="btn-edit-detail" title="Editar"><i class="ti ti-edit"></i></button>
      <button class="btn-sm danger" id="btn-delete-detail" title="Excluir"><i class="ti ti-trash"></i></button>
      <button class="btn-sm" onclick="closeDetail()" title="Fechar"><i class="ti ti-x"></i></button>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-section"><div class="detail-section-label">Descrição</div><div class="detail-desc" id="dp-desc"></div></div>
    <div class="detail-section"><div class="detail-section-label">Detalhes</div><div class="detail-grid" id="dp-grid"></div></div>
    <div class="detail-section">
      <div class="detail-section-label">Progresso geral</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="progress-large" style="flex:1"><div class="fill" id="dp-prog-fill"></div></div>
        <span style="font-size:13px;font-weight:600;font-family:var(--mono)" id="dp-prog-val"></span>
      </div>
      <div id="dp-auto-badge"></div>
    </div>
    <!-- ETAPAS -->
    <div class="detail-section steps-section">
      <div class="steps-header">
        <div class="detail-section-label" style="margin-bottom:0">Etapas</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="steps-progress-info" id="dp-steps-info"></span>
          <button class="btn-add-step" onclick="showAddStepRow()"><i class="ti ti-plus"></i>Adicionar</button>
        </div>
      </div>
      <div class="steps-list" id="dp-steps-list"></div>
      <div id="add-step-row" style="display:none" class="add-step-row">
        <input class="add-step-input" id="new-step-label" placeholder="Nome da etapa..." onkeydown="if(event.key==='Enter')saveNewStep()"/>
        <input class="add-step-weight" id="new-step-weight" type="number" min="1" max="100" value="1" title="Peso"/>
        <button class="btn-step-save" onclick="saveNewStep()">OK</button>
        <button class="btn-step-cancel" onclick="hideAddStepRow()">✕</button>
      </div>
    </div>
    <div class="move-section"><div class="move-label">Mover para</div><div class="move-btns" id="dp-move-btns"></div></div>
  </div>
</div>

<!-- MODAL ATIVIDADE -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modal-title">Nova atividade</h2><button class="btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div class="form-group"><label>Título da atividade *</label><input type="text" id="f-titulo" placeholder="Ex: Relatório mensal de KPIs"/></div>
    <div class="form-group"><label>Descrição</label><textarea id="f-desc" placeholder="Descreva a demanda em detalhes..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Responsável</label><input type="text" id="f-resp" placeholder="Nome do responsável"/></div>
      <div class="form-group"><label>Área / Setor</label><input type="text" id="f-area" placeholder="Ex: TI, RH, Financeiro"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Status</label><select id="f-status"><option value="Pendente">Pendente</option><option value="Em andamento">Em andamento</option><option value="Concluído">Concluído</option><option value="Arquivado">Arquivado</option></select></div>
      <div class="form-group"><label>Prioridade</label><select id="f-prioridade"><option value="Alta">Alta</option><option value="Média">Média</option><option value="Baixa">Baixa</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Data de início</label><input type="date" id="f-inicio"/></div>
      <div class="form-group" style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end">
        <div><label>Prazo (data)</label><input type="date" id="f-prazo"/></div>
        <div><label>Horário</label><input type="time" id="f-prazo-hora" value="23:59" style="width:88px"/></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Pasta</label><select id="f-folder"><option value="">— Sem pasta —</option></select></div>
      <div class="form-group">
        <label>Progresso (%)</label>
        <input type="number" id="f-prog" min="0" max="100" value="0"/>
        <div class="form-info"><i class="ti ti-info-circle"></i>Calculado automaticamente se houver etapas</div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-save" onclick="saveActivity()">Salvar atividade</button></div>
  </div>
</div>

<!-- MODAL PASTA -->
<div class="modal-overlay" id="folder-modal-overlay">
  <div class="modal" style="max-width:360px">
    <div class="modal-head"><h2 id="folder-modal-title">Nova pasta</h2><button class="btn-sm" onclick="closeFolderModal()"><i class="ti ti-x"></i></button></div>
    <div class="form-group"><label>Nome da pasta *</label><input type="text" id="f-folder-name" placeholder="Ex: Rotinas, Projetos, Urgente..."/></div>
    <div class="form-group"><label>Cor</label><div class="color-picker" id="color-picker"></div></div>
    <div class="modal-footer"><button class="btn-cancel" onclick="closeFolderModal()">Cancelar</button><button class="btn-save" onclick="saveFolder()">Salvar pasta</button></div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-box" id="confirm-box">
  <div class="confirm-inner">
    <h3 id="confirm-title">Confirmar</h3><p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="document.getElementById('confirm-box').classList.remove('open')">Cancelar</button>
      <button class="btn-danger" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg"></span></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyAuksKIVIJhKZ0RAk-BWZNfFY3YEzJ5Rrw",
  authDomain:"dashboard-atividades-4d4c5.firebaseapp.com",
  projectId:"dashboard-atividades-4d4c5",
  storageBucket:"dashboard-atividades-4d4c5.firebasestorage.app",
  messagingSenderId:"491355949348",
  appId:"1:491355949348:web:9260450fdb449a51670bb1"
});
const db=getFirestore(app);
const actCol=collection(db,"atividades");
const folCol=collection(db,"pastas");

// ── STATE ──────────────────────────────────────────────────────────────────
let activities=[], folders=[];
let currentFilter='todas', currentView='board', currentFolder=null;
let selectedId=null, editingId=null, editingFolderId=null, selectedColor='#1a6bdc';
const FOLDER_COLORS=['#1a6bdc','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#ea580c','#65a30d','#374151'];

// ── SYNC ───────────────────────────────────────────────────────────────────
function setSyncStatus(s){
  const dot=document.getElementById('sync-dot'),txt=document.getElementById('sync-text');
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  txt.textContent=s==='syncing'?'Sincronizando...':s==='error'?'Erro de conexão':'Sincronizado';
}

// ── REALTIME ───────────────────────────────────────────────────────────────
let actLoaded=false,folLoaded=false;
function checkLoaded(){
  if(actLoaded&&folLoaded){
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    renderFolderNav(); render();
  }
}
onSnapshot(query(actCol,orderBy("createdAt","asc")),snap=>{
  activities=snap.docs.map(d=>({id:d.id,...d.data()}));
  actLoaded=true; setSyncStatus('ok'); checkLoaded(); render(); renderFolderNav();
},()=>setSyncStatus('error'));
onSnapshot(query(folCol,orderBy("createdAt","asc")),snap=>{
  folders=snap.docs.map(d=>({id:d.id,...d.data()}));
  folLoaded=true; checkLoaded(); renderFolderNav(); renderFolderSelect(); render();
});

// ── UTILS ──────────────────────────────────────────────────────────────────
const COLS=[
  {key:'Em andamento',dot:'#1a6bdc',icon:'ti-loader'},
  {key:'Pendente',dot:'#d97706',icon:'ti-clock'},
  {key:'Concluído',dot:'#16a34a',icon:'ti-circle-check'},
  {key:'Arquivado',dot:'#6b7280',icon:'ti-archive'},
];
const priClass=p=>p==='Alta'?'pri-alta':p==='Média'?'pri-media':'pri-baixa';
const progColor=s=>s==='Concluído'?'#16a34a':s==='Em andamento'?'#1a6bdc':s==='Pendente'?'#d97706':'#9ca3af';
const fmtDate=d=>{if(!d)return'—';const[y,m,dy]=d.split('-');return`${dy}/${m}/${y}`;};
const sKey=s=>s.toLowerCase().replace(' ','_').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const statusBadge=s=>`<span class="status-badge s-${sKey(s)}">${s}</span>`;
const getFolder=id=>folders.find(f=>f.id===id);

function isOverdue(a){
  if(!a.prazo||a.status==='Concluído'||a.status==='Arquivado')return false;
  const hora=a.prazoHora||'23:59';
  return new Date(`${a.prazo}T${hora}:00`)<new Date();
}
function fmtDeadline(a){
  if(!a.prazo)return'—';
  return`${fmtDate(a.prazo)} ${a.prazoHora||'23:59'}`;
}

// ── STEPS: calcula progresso ponderado ────────────────────────────────────
function calcProgFromSteps(steps){
  if(!steps||!steps.length) return null; // sem etapas → usa prog manual
  const totalWeight=steps.reduce((s,e)=>s+(e.weight||1),0);
  const doneWeight=steps.filter(e=>e.done).reduce((s,e)=>s+(e.weight||1),0);
  return totalWeight===0?0:Math.round((doneWeight/totalWeight)*100);
}

// Retorna progresso efetivo (etapas se existir, senão manual)
function effectiveProg(a){
  const fromSteps=calcProgFromSteps(a.steps);
  return fromSteps!==null?fromSteps:(a.prog||0);
}

// ── KPIs ───────────────────────────────────────────────────────────────────
function updateKPIs(){
  const vis=currentFolder?activities.filter(a=>a.folderId===currentFolder):activities;
  const cnt={'Em andamento':0,'Pendente':0,'Concluído':0,'Arquivado':0};
  vis.forEach(a=>cnt[a.status]++);
  const total=vis.length, overdue=vis.filter(isOverdue).length;
  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Em andamento</span><div class="kpi-icon" style="background:#e8f0fd;color:#1a6bdc"><i class="ti ti-loader"></i></div></div><div class="kpi-num">${cnt['Em andamento']}</div><div class="kpi-sub">atividades ativas</div></div>
    <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Pendentes</span><div class="kpi-icon" style="background:#fef3c7;color:#d97706"><i class="ti ti-clock"></i></div></div><div class="kpi-num">${cnt['Pendente']}</div><div class="kpi-sub">aguardando início</div></div>
    <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Concluídos</span><div class="kpi-icon" style="background:#dcfce7;color:#16a34a"><i class="ti ti-circle-check"></i></div></div><div class="kpi-num">${cnt['Concluído']}</div><div class="kpi-sub">de ${total} totais</div></div>
    <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Atrasadas</span><div class="kpi-icon" style="background:#fee2e2;color:#dc2626"><i class="ti ti-alert-triangle"></i></div></div><div class="kpi-num">${overdue}</div><div class="kpi-sub">prazo vencido</div></div>`;
  document.getElementById('nb-total').textContent=activities.length;
  document.getElementById('nb-em_andamento').textContent=activities.filter(a=>a.status==='Em andamento').length;
  document.getElementById('nb-pendente').textContent=activities.filter(a=>a.status==='Pendente').length;
  document.getElementById('nb-concluido').textContent=activities.filter(a=>a.status==='Concluído').length;
  document.getElementById('nb-arquivado').textContent=activities.filter(a=>a.status==='Arquivado').length;
}

// ── FOLDER NAV ─────────────────────────────────────────────────────────────
function renderFolderNav(){
  const nav=document.getElementById('folder-nav');
  if(!folders.length){nav.innerHTML='<div style="padding:4px 18px;font-size:12px;color:var(--text-tertiary)">Nenhuma pasta</div>';return;}
  nav.innerHTML=folders.map(f=>`
    <div class="folder-row">
      <button class="folder-btn${currentFolder===f.id?' active':''}" onclick="openFolder('${f.id}')">
        <div class="folder-dot" style="background:${f.color}"></div>
        <span>${f.name}</span>
        <span class="nav-badge">${activities.filter(a=>a.folderId===f.id).length}</span>
      </button>
      <div class="folder-actions">
        <button class="fol-act-btn" onclick="openFolderModal('${f.id}')"><i class="ti ti-pencil"></i></button>
        <button class="fol-act-btn del" onclick="confirmDeleteFolder('${f.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('');
}
function renderFolderSelect(){
  const sel=document.getElementById('f-folder');
  const cur=sel.value;
  sel.innerHTML='<option value="">— Sem pasta —</option>'+folders.map(f=>`<option value="${f.id}">${f.name}</option>`).join('');
  if(cur)sel.value=cur;
}
window.openFolder=function(id){
  currentFolder=id; currentFilter='todas';
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  document.querySelector('.pill').classList.add('active');
  const f=getFolder(id);
  document.getElementById('page-title').innerHTML=`<span style="width:10px;height:10px;border-radius:50%;background:${f.color};display:inline-block"></span>${f.name}`;
  renderFolderNav(); render();
}

// ── RENDER ─────────────────────────────────────────────────────────────────
window.render=function(){
  updateKPIs();
  const q=(document.getElementById('search-input')?.value||'').toLowerCase().trim();
  const filtered=activities.filter(a=>{
    const mF=currentFilter==='todas'||a.status===currentFilter;
    const mFol=!currentFolder||a.folderId===currentFolder;
    const mS=!q||a.titulo.toLowerCase().includes(q)||(a.resp||'').toLowerCase().includes(q)||(a.area||'').toLowerCase().includes(q);
    return mF&&mFol&&mS;
  });
  if(currentView==='list')renderList(filtered);
  else renderBoard(filtered);
  if(selectedId)renderDetail();
}

function cardHTML(a){
  const f=getFolder(a.folderId), od=isOverdue(a);
  const prog=effectiveProg(a);
  const steps=a.steps||[];
  const doneSteps=steps.filter(s=>s.done).length;
  return`<div class="act-card${selectedId===a.id?' selected':''}" onclick="selectCard('${a.id}')">
    ${f?`<div class="folder-tag" style="background:${f.color}22;color:${f.color}"><i class="ti ti-folder" style="font-size:10px"></i>${f.name}</div>`:''}
    <div class="act-card-top">
      <span class="act-title">${a.titulo}${od?'<span class="overdue-tag">Atrasada</span>':''}</span>
      <span class="badge-priority ${priClass(a.prioridade)}">${a.prioridade}</span>
    </div>
    <div class="act-meta">
      ${a.resp?`<span class="meta-item"><i class="ti ti-user"></i>${a.resp}</span>`:''}
      ${a.area?`<span class="meta-item"><i class="ti ti-building"></i>${a.area}</span>`:''}
      ${a.prazo?`<span class="meta-item"><i class="ti ti-calendar"></i>${fmtDate(a.prazo)} ${a.prazoHora||'23:59'}</span>`:''}
    </div>
    ${steps.length?`<div class="steps-mini">${steps.map(s=>`<div class="step-mini-dot${s.done?' done':''}" title="${s.label}"></div>`).join('')}<span class="steps-mini-label">${doneSteps}/${steps.length}</span></div>`:''}
    ${prog>0?`<div class="progress-bar"><div class="progress-fill" style="width:${prog}%;background:${progColor(a.status)}"></div></div>`:''}
  </div>`;
}

function renderBoard(filtered){
  const board=document.getElementById('board');
  const cols=currentFilter==='todas'?COLS:COLS.filter(c=>c.key===currentFilter);
  board.style.gridTemplateColumns=`repeat(${Math.min(cols.length,4)},1fr)`;
  board.innerHTML='';
  cols.forEach(col=>{
    const items=filtered.filter(a=>a.status===col.key);
    const wrap=document.createElement('div');
    wrap.className='col-wrap';
    wrap.innerHTML=`<div class="col-header"><div class="col-dot" style="background:${col.dot}"></div><span class="col-name">${col.key}</span><span class="col-count">${items.length}</span></div>
    <div class="col-body">${items.length?items.map(cardHTML).join(''):`<div class="empty-col"><i class="ti ${col.icon}"></i>Nenhuma atividade</div>`}</div>`;
    board.appendChild(wrap);
  });
}
function renderList(filtered){
  const lv=document.getElementById('list-view');
  if(!filtered.length){lv.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-tertiary)">Nenhuma atividade encontrada</div>';return;}
  lv.innerHTML=`<table class="activity-table"><thead><tr><th>Atividade</th><th>Responsável</th><th>Área</th><th>Pasta</th><th>Status</th><th>Prioridade</th><th>Prazo</th><th>Etapas</th><th>Progresso</th></tr></thead><tbody>
  ${filtered.map(a=>{
    const f=getFolder(a.folderId),od=isOverdue(a);
    const prog=effectiveProg(a);
    const steps=a.steps||[];
    return`<tr onclick="selectCard('${a.id}')">
      <td style="font-weight:500;max-width:180px">${a.titulo}${od?'<span class="overdue-tag">Atrasada</span>':''}</td>
      <td>${a.resp||'—'}</td><td>${a.area||'—'}</td>
      <td>${f?`<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:${f.color};display:inline-block"></span>${f.name}</span>`:'—'}</td>
      <td>${statusBadge(a.status)}</td>
      <td><span class="badge-priority ${priClass(a.prioridade)}">${a.prioridade}</span></td>
      <td style="font-family:var(--mono);font-size:12px;white-space:nowrap">${fmtDeadline(a)}</td>
      <td style="font-size:12px;white-space:nowrap">${steps.length?`${steps.filter(s=>s.done).length}/${steps.length}`:'—'}</td>
      <td><div style="display:flex;align-items:center;gap:8px;min-width:90px"><div class="progress-bar" style="flex:1;height:5px"><div class="progress-fill" style="width:${prog}%;background:${progColor(a.status)}"></div></div><span style="font-size:11px;font-family:var(--mono);color:var(--text-secondary)">${prog}%</span></div></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

// ── DETAIL ─────────────────────────────────────────────────────────────────
window.selectCard=function(id){
  if(selectedId===id){closeDetail();return;}
  selectedId=id;
  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
  renderDetail(); render();
}
window.closeDetail=function(){
  selectedId=null;
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  render();
}
function renderDetail(){
  if(!selectedId)return;
  const a=activities.find(x=>x.id===selectedId); if(!a)return;
  const f=getFolder(a.folderId);
  const prog=effectiveProg(a);
  const steps=a.steps||[];
  const hasSteps=steps.length>0;

  document.getElementById('dp-title').textContent=a.titulo;
  document.getElementById('dp-badge').innerHTML=`${statusBadge(a.status)}<span class="badge-priority ${priClass(a.prioridade)}" style="margin-left:6px">${a.prioridade}</span>${f?`<span class="folder-tag" style="background:${f.color}22;color:${f.color};margin-left:6px"><i class="ti ti-folder" style="font-size:10px"></i>${f.name}</span>`:''}`;
  document.getElementById('dp-desc').textContent=a.desc||'Sem descrição.';
  const od=isOverdue(a);
  document.getElementById('dp-grid').innerHTML=`
    <div class="detail-field"><label>Responsável</label><span>${a.resp||'—'}</span></div>
    <div class="detail-field"><label>Área / Setor</label><span>${a.area||'—'}</span></div>
    <div class="detail-field"><label>Data de início</label><span>${fmtDate(a.inicio)}</span></div>
    <div class="detail-field"><label>Prazo</label><span style="${od?'color:var(--red);font-weight:600':''}">${fmtDeadline(a)}${od?' ⚠':''}</span></div>`;

  const pf=document.getElementById('dp-prog-fill');
  pf.style.width=prog+'%'; pf.style.background=progColor(a.status);
  document.getElementById('dp-prog-val').textContent=prog+'%';
  document.getElementById('dp-auto-badge').innerHTML=hasSteps?'<div class="auto-badge"><i class="ti ti-cpu" style="font-size:11px"></i>Calculado pelas etapas</div>':'';

  // STEPS INFO
  if(hasSteps){
    const totalW=steps.reduce((s,e)=>s+(e.weight||1),0);
    const doneW=steps.filter(e=>e.done).reduce((s,e)=>s+(e.weight||1),0);
    document.getElementById('dp-steps-info').innerHTML=`<strong>${steps.filter(s=>s.done).length}/${steps.length}</strong> concluídas · peso ${doneW}/${totalW}`;
  } else {
    document.getElementById('dp-steps-info').innerHTML='';
  }

  // STEPS LIST
  const list=document.getElementById('dp-steps-list');
  list.innerHTML=steps.length?steps.map((s,i)=>`
    <div class="step-item">
      <div class="step-check${s.done?' done':''}" onclick="toggleStep('${a.id}',${i})"></div>
      <span class="step-label${s.done?' done':''}">${s.label}</span>
      <span class="step-weight" title="Peso">×${s.weight||1}</span>
      <button class="step-del" onclick="deleteStep('${a.id}',${i})" title="Remover"><i class="ti ti-x"></i></button>
    </div>`).join('')
    :'<div class="steps-empty">Nenhuma etapa ainda. Adicione etapas para acompanhar o progresso automaticamente.</div>';

  document.getElementById('dp-move-btns').innerHTML=COLS.filter(c=>c.key!==a.status).map(c=>`<button class="move-btn" onclick="moveCard('${a.id}','${c.key}')"><i class="ti ${c.icon}"></i>${c.key}</button>`).join('');
  document.getElementById('btn-edit-detail').onclick=()=>openModal(selectedId);
  document.getElementById('btn-delete-detail').onclick=()=>confirmDelete(selectedId);
}

// ── STEPS CRUD ─────────────────────────────────────────────────────────────
window.showAddStepRow=function(){
  document.getElementById('add-step-row').style.display='flex';
  document.getElementById('new-step-label').focus();
}
window.hideAddStepRow=function(){
  document.getElementById('add-step-row').style.display='none';
  document.getElementById('new-step-label').value='';
  document.getElementById('new-step-weight').value='1';
}

window.saveNewStep=async function(){
  const label=document.getElementById('new-step-label').value.trim();
  if(!label)return;
  const weight=Math.max(1,parseInt(document.getElementById('new-step-weight').value)||1);
  const a=activities.find(x=>x.id===selectedId); if(!a)return;
  const steps=[...(a.steps||[]),{label,weight,done:false}];
  setSyncStatus('syncing');
  await updateDoc(doc(db,"atividades",selectedId),{steps});
  setSyncStatus('ok');
  hideAddStepRow();
  showToast('Etapa adicionada');
}

window.toggleStep=async function(id,idx){
  const a=activities.find(x=>x.id===id); if(!a)return;
  const steps=a.steps.map((s,i)=>i===idx?{...s,done:!s.done}:s);
  const newProg=calcProgFromSteps(steps);

  // Auto-concluir: se todas as etapas concluídas → status Concluído
  const allDone=steps.every(s=>s.done);
  const update={steps};
  if(allDone && a.status!=='Concluído'){
    update.status='Concluído';
    update.prog=100;
    showToast('✅ Atividade concluída automaticamente!');
  } else if(!allDone && a.status==='Concluído' && (a.steps||[]).length>0){
    // Se desmarcou uma etapa e estava concluída → volta para Em andamento
    update.status='Em andamento';
  }
  if(newProg!==null) update.prog=newProg;

  setSyncStatus('syncing');
  await updateDoc(doc(db,"atividades",id),update);
  setSyncStatus('ok');
}

window.deleteStep=async function(id,idx){
  const a=activities.find(x=>x.id===id); if(!a)return;
  const steps=a.steps.filter((_,i)=>i!==idx);
  const newProg=calcProgFromSteps(steps);
  const update={steps};
  if(newProg!==null) update.prog=newProg;
  setSyncStatus('syncing');
  await updateDoc(doc(db,"atividades",id),update);
  setSyncStatus('ok');
  showToast('Etapa removida');
}

// ── CRUD ATIVIDADES ────────────────────────────────────────────────────────
window.moveCard=async function(id,status){
  setSyncStatus('syncing');
  await updateDoc(doc(db,"atividades",id),{status,...(status==='Concluído'?{prog:100}:{})});
  setSyncStatus('ok'); showToast('Movido para '+status);
}

window.openModal=function(id){
  editingId=id||null;
  document.getElementById('modal-title').textContent=id?'Editar atividade':'Nova atividade';
  renderFolderSelect();
  if(id){
    const a=activities.find(x=>x.id===id);
    document.getElementById('f-titulo').value=a.titulo;
    document.getElementById('f-desc').value=a.desc||'';
    document.getElementById('f-resp').value=a.resp||'';
    document.getElementById('f-area').value=a.area||'';
    document.getElementById('f-status').value=a.status;
    document.getElementById('f-prioridade').value=a.prioridade;
    document.getElementById('f-inicio').value=a.inicio||'';
    document.getElementById('f-prazo').value=a.prazo||'';
    document.getElementById('f-prazo-hora').value=a.prazoHora||'23:59';
    document.getElementById('f-folder').value=a.folderId||'';
    document.getElementById('f-prog').value=a.prog||0;
  }else{
    ['f-titulo','f-desc','f-resp','f-area','f-inicio','f-prazo'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-status').value='Pendente';
    document.getElementById('f-prioridade').value='Média';
    document.getElementById('f-prazo-hora').value='23:59';
    document.getElementById('f-prog').value=0;
    document.getElementById('f-folder').value=currentFolder||'';
  }
  document.getElementById('modal-overlay').classList.add('open');
}
window.closeModal=function(){document.getElementById('modal-overlay').classList.remove('open');}

window.saveActivity=async function(){
  const titulo=document.getElementById('f-titulo').value.trim();
  if(!titulo){document.getElementById('f-titulo').focus();return;}
  const manualProg=Math.min(100,Math.max(0,parseInt(document.getElementById('f-prog').value)||0));
  let status=document.getElementById('f-status').value;
  // Auto-concluir se prog manual = 100 e sem etapas
  if(manualProg===100 && status!=='Arquivado') status='Concluído';
  const data={
    titulo,desc:document.getElementById('f-desc').value.trim(),
    resp:document.getElementById('f-resp').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    status,
    prioridade:document.getElementById('f-prioridade').value,
    inicio:document.getElementById('f-inicio').value,
    prazo:document.getElementById('f-prazo').value,
    prazoHora:document.getElementById('f-prazo-hora').value||'23:59',
    folderId:document.getElementById('f-folder').value||null,
    prog:manualProg,
  };
  setSyncStatus('syncing');
  if(editingId){await updateDoc(doc(db,"atividades",editingId),data);showToast('Atividade atualizada');}
  else{await addDoc(actCol,{...data,createdAt:serverTimestamp()});showToast('Atividade criada');}
  setSyncStatus('ok'); closeModal();
}

window.confirmDelete=function(id){
  document.getElementById('confirm-title').textContent='Excluir atividade?';
  document.getElementById('confirm-msg').textContent='Esta ação não pode ser desfeita.';
  const box=document.getElementById('confirm-box'); box.classList.add('open');
  document.getElementById('confirm-ok').onclick=async()=>{
    setSyncStatus('syncing');
    await deleteDoc(doc(db,"atividades",id));
    setSyncStatus('ok'); box.classList.remove('open'); closeDetail(); showToast('Atividade excluída');
  };
}

// ── CRUD PASTAS ────────────────────────────────────────────────────────────
function buildColorPicker(){
  document.getElementById('color-picker').innerHTML=FOLDER_COLORS.map(c=>
    `<div class="color-opt${c===selectedColor?' selected':''}" style="background:${c}" data-color="${c}" onclick="selectColor(this)"></div>`
  ).join('');
}
window.openFolderModal=function(id){
  editingFolderId=id||null;
  document.getElementById('folder-modal-title').textContent=id?'Editar pasta':'Nova pasta';
  if(id){const f=getFolder(id);document.getElementById('f-folder-name').value=f.name;selectedColor=f.color;}
  else{document.getElementById('f-folder-name').value='';selectedColor='#1a6bdc';}
  buildColorPicker();
  document.getElementById('folder-modal-overlay').classList.add('open');
}
window.closeFolderModal=function(){document.getElementById('folder-modal-overlay').classList.remove('open');}
window.selectColor=function(el){
  document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected'); selectedColor=el.dataset.color;
}
window.saveFolder=async function(){
  const name=document.getElementById('f-folder-name').value.trim();
  if(!name){document.getElementById('f-folder-name').focus();return;}
  setSyncStatus('syncing');
  if(editingFolderId){await updateDoc(doc(db,"pastas",editingFolderId),{name,color:selectedColor});showToast('Pasta atualizada');}
  else{await addDoc(folCol,{name,color:selectedColor,createdAt:serverTimestamp()});showToast('Pasta criada');}
  setSyncStatus('ok'); closeFolderModal();
}
window.confirmDeleteFolder=function(id){
  document.getElementById('confirm-title').textContent='Excluir pasta?';
  document.getElementById('confirm-msg').textContent='As atividades desta pasta serão mantidas, mas ficarão sem pasta.';
  const box=document.getElementById('confirm-box'); box.classList.add('open');
  document.getElementById('confirm-ok').onclick=async()=>{
    setSyncStatus('syncing');
    await deleteDoc(doc(db,"pastas",id));
    const affected=activities.filter(a=>a.folderId===id);
    await Promise.all(affected.map(a=>updateDoc(doc(db,"atividades",a.id),{folderId:null})));
    if(currentFolder===id){currentFolder=null;document.getElementById('page-title').textContent='Painel de Atividades';}
    setSyncStatus('ok'); box.classList.remove('open'); showToast('Pasta excluída');
  };
}

// ── FILTER / VIEW / NAV ────────────────────────────────────────────────────
window.setFilter=function(f,btn){
  currentFilter=f;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  if(btn)btn.classList.add('active');
  render();
}
window.navClick=function(mode,btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); currentFolder=null;
  const labels={em_andamento:'Em andamento',pendente:'Pendente',concluido:'Concluído',arquivado:'Arquivado'};
  if(mode==='board'){setFilter('todas',null);document.getElementById('page-title').textContent='Painel de Atividades';}
  else{setFilter(labels[mode],null);document.getElementById('page-title').textContent=labels[mode];}
  renderFolderNav();
}
window.setView=function(v){
  currentView=v;
  document.getElementById('vbtn-board').classList.toggle('active',v==='board');
  document.getElementById('vbtn-list').classList.toggle('active',v==='list');
  document.getElementById('board').style.display=v==='board'?'grid':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  render();
}

// ── EXPORT ─────────────────────────────────────────────────────────────────
window.exportCSV=function(){
  const header=['Título','Responsável','Área','Pasta','Status','Prioridade','Início','Prazo','Horário','Progresso','Etapas concluídas','Total etapas'];
  const rows=activities.map(a=>{
    const f=getFolder(a.folderId);
    const steps=a.steps||[];
    const prog=effectiveProg(a);
    return[`"${a.titulo}"`,`"${a.resp||''}"`,`"${a.area||''}"`,`"${f?f.name:''}"`,a.status,a.prioridade,a.inicio||'',a.prazo||'',a.prazoHora||'23:59',prog+'%',steps.filter(s=>s.done).length,steps.length];
  });
  const csv=[header,...rows].map(r=>r.join(';')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download='atividades.csv';el.click();
  showToast('CSV exportado');
}

// ── TOAST ──────────────────────────────────────────────────────────────────
let toastTimer;
window.showToast=function(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeFolderModal();closeDetail();document.getElementById('confirm-box').classList.remove('open');hideAddStepRow();}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('search-input').focus();}
});
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('folder-modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeFolderModal();});
</script>
